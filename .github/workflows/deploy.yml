name: Deploy SafetyNet App

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: eu-west-1

jobs:
  test-library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install and test library
        run: |
          cd library
          pip install -e .
          pip install pytest
          pytest tests/ -v

  deploy-backend:
    runs-on: ubuntu-latest
    needs: test-library
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Create DynamoDB table if not exists
        run: |
          if ! aws dynamodb describe-table --table-name safetyreports-prod --region eu-west-1 > /dev/null 2>&1; then
            aws dynamodb create-table \
              --table-name safetyreports-prod \
              --attribute-definitions AttributeName=id,AttributeType=S \
              --key-schema AttributeName=id,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region eu-west-1
            echo "Waiting for table to become active..."
            aws dynamodb wait table-exists --table-name safetyreports-prod --region eu-west-1
          else
            echo "DynamoDB table safetyreports-prod already exists"
          fi

      - name: Create S3 bucket for images if not exists
        run: |
          if ! aws s3api head-bucket --bucket safetyreports-images-prod-adithya --region eu-west-1 2>/dev/null; then
            aws s3api create-bucket \
              --bucket safetyreports-images-prod-adithya \
              --region eu-west-1 \
              --create-bucket-configuration LocationConstraint=eu-west-1

            aws s3api put-bucket-cors --bucket safetyreports-images-prod-adithya --cors-configuration '{
              "CORSRules": [
                {
                  "AllowedHeaders": ["*"],
                  "AllowedMethods": ["GET", "PUT", "POST", "DELETE"],
                  "AllowedOrigins": ["*"],
                  "ExposeHeaders": ["ETag"],
                  "MaxAgeSeconds": 3000
                }
              ]
            }'
          else
            echo "S3 bucket safetyreports-images-prod-adithya already exists"
          fi

      - name: Create IAM role for Lambda if not exists
        run: |
          if ! aws iam get-role --role-name safetyreports-lambda-role > /dev/null 2>&1; then
            aws iam create-role \
              --role-name safetyreports-lambda-role \
              --assume-role-policy-document '{
                "Version": "2012-10-17",
                "Statement": [
                  {
                    "Effect": "Allow",
                    "Principal": {
                      "Service": "lambda.amazonaws.com"
                    },
                    "Action": "sts:AssumeRole"
                  }
                ]
              }'
          else
            echo "IAM role safetyreports-lambda-role already exists"
          fi

      - name: Attach policies to Lambda role
        run: |
          aws iam attach-role-policy \
            --role-name safetyreports-lambda-role \
            --policy-arn arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess || true

          aws iam attach-role-policy \
            --role-name safetyreports-lambda-role \
            --policy-arn arn:aws:iam::aws:policy/AmazonS3FullAccess || true

          aws iam attach-role-policy \
            --role-name safetyreports-lambda-role \
            --policy-arn arn:aws:iam::aws:policy/AmazonSNSFullAccess || true

          aws iam attach-role-policy \
            --role-name safetyreports-lambda-role \
            --policy-arn arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole || true

      - name: Create SNS topic
        run: |
          SNS_TOPIC_ARN=$(aws sns create-topic --name safetyreports-notifications --region eu-west-1 --query 'TopicArn' --output text)
          echo "SNS_TOPIC_ARN=$SNS_TOPIC_ARN" >> $GITHUB_ENV
          echo "SNS Topic ARN: $SNS_TOPIC_ARN"

      - name: Wait for IAM propagation
        run: sleep 10

      - name: Package Lambda function
        run: |
          cd backend
          zip -r ../lambda.zip lambda_function.py

      - name: Deploy Lambda function
        run: |
          ROLE_ARN=$(aws iam get-role --role-name safetyreports-lambda-role --query 'Role.Arn' --output text)

          if aws lambda get-function --function-name safetyreports-api --region eu-west-1 > /dev/null 2>&1; then
            echo "Updating existing Lambda function..."
            aws lambda update-function-code \
              --function-name safetyreports-api \
              --zip-file fileb://lambda.zip \
              --region eu-west-1

            aws lambda wait function-updated --function-name safetyreports-api --region eu-west-1

            aws lambda update-function-configuration \
              --function-name safetyreports-api \
              --runtime python3.11 \
              --handler lambda_function.lambda_handler \
              --role "$ROLE_ARN" \
              --timeout 30 \
              --memory-size 256 \
              --environment "Variables={DYNAMODB_TABLE=safetyreports-prod,S3_BUCKET=safetyreports-images-prod-adithya,SNS_TOPIC_ARN=${{ env.SNS_TOPIC_ARN }},REGION=eu-west-1,JWT_SECRET=safetyreports-secret-2026}" \
              --region eu-west-1
          else
            echo "Creating new Lambda function..."
            aws lambda create-function \
              --function-name safetyreports-api \
              --runtime python3.11 \
              --handler lambda_function.lambda_handler \
              --role "$ROLE_ARN" \
              --zip-file fileb://lambda.zip \
              --timeout 30 \
              --memory-size 256 \
              --environment "Variables={DYNAMODB_TABLE=safetyreports-prod,S3_BUCKET=safetyreports-images-prod-adithya,SNS_TOPIC_ARN=${{ env.SNS_TOPIC_ARN }},REGION=eu-west-1,JWT_SECRET=safetyreports-secret-2026}" \
              --region eu-west-1

            aws lambda wait function-active --function-name safetyreports-api --region eu-west-1
          fi

      - name: Setup API Gateway
        run: |
          LAMBDA_ARN=$(aws lambda get-function --function-name safetyreports-api --region eu-west-1 --query 'Configuration.FunctionArn' --output text)
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query 'Account' --output text)

          # Check if API already exists
          API_ID=$(aws apigateway get-rest-apis --region eu-west-1 --query "items[?name=='safetyreports-api'].id" --output text)

          if [ -z "$API_ID" ]; then
            echo "Creating new API Gateway..."
            API_ID=$(aws apigateway create-rest-api \
              --name safetyreports-api \
              --description "SafetyNet Incident Reporting API" \
              --endpoint-configuration types=REGIONAL \
              --region eu-west-1 \
              --query 'id' --output text)
          else
            echo "API Gateway safetyreports-api already exists with ID: $API_ID"
          fi

          echo "API_ID=$API_ID" >> $GITHUB_ENV

          # Get root resource ID
          ROOT_ID=$(aws apigateway get-resources --rest-api-id $API_ID --region eu-west-1 --query "items[?path=='/'].id" --output text)

          # Create proxy resource if not exists
          PROXY_ID=$(aws apigateway get-resources --rest-api-id $API_ID --region eu-west-1 --query "items[?path=='/{proxy+}'].id" --output text)
          if [ -z "$PROXY_ID" ]; then
            PROXY_ID=$(aws apigateway create-resource \
              --rest-api-id $API_ID \
              --parent-id $ROOT_ID \
              --path-part "{proxy+}" \
              --region eu-west-1 \
              --query 'id' --output text)
          fi

          # ANY method on proxy resource
          aws apigateway put-method \
            --rest-api-id $API_ID \
            --resource-id $PROXY_ID \
            --http-method ANY \
            --authorization-type NONE \
            --request-parameters "method.request.path.proxy=true" \
            --region eu-west-1 || true

          aws apigateway put-integration \
            --rest-api-id $API_ID \
            --resource-id $PROXY_ID \
            --http-method ANY \
            --type AWS_PROXY \
            --integration-http-method POST \
            --uri "arn:aws:apigateway:eu-west-1:lambda:path/2015-03-31/functions/$LAMBDA_ARN/invocations" \
            --region eu-west-1 || true

          # OPTIONS method on proxy resource for CORS
          aws apigateway put-method \
            --rest-api-id $API_ID \
            --resource-id $PROXY_ID \
            --http-method OPTIONS \
            --authorization-type NONE \
            --region eu-west-1 || true

          aws apigateway put-integration \
            --rest-api-id $API_ID \
            --resource-id $PROXY_ID \
            --http-method OPTIONS \
            --type MOCK \
            --request-templates '{"application/json": "{\"statusCode\": 200}"}' \
            --region eu-west-1 || true

          aws apigateway put-method-response \
            --rest-api-id $API_ID \
            --resource-id $PROXY_ID \
            --http-method OPTIONS \
            --status-code 200 \
            --response-parameters '{"method.response.header.Access-Control-Allow-Headers":false,"method.response.header.Access-Control-Allow-Methods":false,"method.response.header.Access-Control-Allow-Origin":false}' \
            --region eu-west-1 || true

          aws apigateway put-integration-response \
            --rest-api-id $API_ID \
            --resource-id $PROXY_ID \
            --http-method OPTIONS \
            --status-code 200 \
            --response-parameters '{"method.response.header.Access-Control-Allow-Headers":"'"'"'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"'"'","method.response.header.Access-Control-Allow-Methods":"'"'"'GET,POST,PUT,DELETE,OPTIONS'"'"'","method.response.header.Access-Control-Allow-Origin":"'"'"'*'"'"'"}' \
            --region eu-west-1 || true

          # ANY method on root resource
          aws apigateway put-method \
            --rest-api-id $API_ID \
            --resource-id $ROOT_ID \
            --http-method ANY \
            --authorization-type NONE \
            --region eu-west-1 || true

          aws apigateway put-integration \
            --rest-api-id $API_ID \
            --resource-id $ROOT_ID \
            --http-method ANY \
            --type AWS_PROXY \
            --integration-http-method POST \
            --uri "arn:aws:apigateway:eu-west-1:lambda:path/2015-03-31/functions/$LAMBDA_ARN/invocations" \
            --region eu-west-1 || true

          # Lambda permission for API Gateway
          aws lambda add-permission \
            --function-name safetyreports-api \
            --statement-id apigateway-invoke-$(date +%s) \
            --action lambda:InvokeFunction \
            --principal apigateway.amazonaws.com \
            --source-arn "arn:aws:execute-api:eu-west-1:$AWS_ACCOUNT_ID:$API_ID/*" \
            --region eu-west-1 || true

          # Deploy API
          aws apigateway create-deployment \
            --rest-api-id $API_ID \
            --stage-name prod \
            --region eu-west-1

          echo "API URL: https://$API_ID.execute-api.eu-west-1.amazonaws.com/prod"

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Get API URL
        run: |
          API_ID=$(aws apigateway get-rest-apis --region eu-west-1 --query "items[?name=='safetyreports-api'].id" --output text)
          API_URL="https://$API_ID.execute-api.eu-west-1.amazonaws.com/prod"
          echo "VITE_API_URL=$API_URL" >> $GITHUB_ENV
          echo "API URL: $API_URL"

      - name: Build frontend
        run: |
          cd frontend
          rm -rf node_modules package-lock.json
          npm install --force
          VITE_API_URL=${{ env.VITE_API_URL }} npm run build

      - name: Create frontend S3 bucket if not exists
        run: |
          if ! aws s3api head-bucket --bucket safetyreports-frontend-prod-adithya --region eu-west-1 2>/dev/null; then
            aws s3api create-bucket \
              --bucket safetyreports-frontend-prod-adithya \
              --region eu-west-1 \
              --create-bucket-configuration LocationConstraint=eu-west-1
          fi

      - name: Configure static website hosting
        run: |
          aws s3 website s3://safetyreports-frontend-prod-adithya \
            --index-document index.html \
            --error-document index.html

      - name: Disable block public access
        run: |
          aws s3api put-public-access-block \
            --bucket safetyreports-frontend-prod-adithya \
            --public-access-block-configuration "BlockPublicAcls=false,IgnorePublicAcls=false,BlockPublicPolicy=false,RestrictPublicBuckets=false"

      - name: Set bucket policy for public read
        run: |
          aws s3api put-bucket-policy \
            --bucket safetyreports-frontend-prod-adithya \
            --policy '{
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Sid": "PublicReadGetObject",
                  "Effect": "Allow",
                  "Principal": "*",
                  "Action": "s3:GetObject",
                  "Resource": "arn:aws:s3:::safetyreports-frontend-prod-adithya/*"
                }
              ]
            }'

      - name: Deploy to S3
        run: |
          aws s3 sync frontend/dist s3://safetyreports-frontend-prod-adithya --delete
          echo "Frontend URL: http://safetyreports-frontend-prod-adithya.s3-website-eu-west-1.amazonaws.com"
